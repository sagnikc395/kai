# .github/workflows/release.yml
name: Release CLI

on:
  push:
    tags:
      - "v*.*.*" # triggers on v1.0.0, v2.3.1, etc.

permissions:
  contents: write # needed to create GitHub Releases

jobs:
  build:
    name: Build (${{ matrix.goos }}-${{ matrix.goarch }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
        - os: ubuntu-latest
          goos: linux
          goarch: amd64
          artifact: kai-linux-amd64

        - os: ubuntu-latest
          goos: linux
          goarch: arm64
          artifact: kai-linux-arm64

        - os: macos-latest
          goos: darwin
          goarch: amd64
          artifact: kai-darwin-amd64

        - os: macos-latest
          goos: darwin
          goarch: arm64
          artifact: kai-darwin-arm64

        - os: windows-latest
          goos: windows
          goarch: amd64
          artifact: kai-windows-amd64.exe

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-go@v5
      with:
        go-version-file: go.mod

    - name: Create dist directory
      run: mkdir -p dist
      shell: bash

    - name: Build binary
      run: go build -trimpath -ldflags="-s -w" -o dist/${{ matrix.artifact }} .
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
      shell: bash

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact }}
        path: dist/${{ matrix.artifact }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: dist/
        merge-multiple: true

    - name: List artifacts
      run: ls -lh dist/

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: dist/*
        generate_release_notes: true
        # Optional: set to true to create a draft first
        # draft: true
