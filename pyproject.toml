[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kai"
version = "2.0.0"
description = "A minimal, hackable CLI coding assistant"
authors = [{name = "Sagnik Chakraborty"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "groq>=0.12,<1",
    "python-dotenv>=1.0,<2",
    "textual>=1.0,<2",
]

[project.scripts]
kai = "kai.app:main"

[tool.hatch.build.targets.wheel]
packages = ["kai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
