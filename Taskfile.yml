version: "3"

vars:
  APP: kai
  DIST: dist

tasks:
  default:
    desc: Run the standard local checks
    deps:
      - check

  run:
    desc: Run kai from source; pass flags after --
    cmds:
      - python main.py {{.CLI_ARGS}}

  build:
    desc: Build the kai package
    cmds:
      - pip install build
      - python -m build --outdir {{.DIST}}

  install:
    desc: Install kai in editable mode
    cmds:
      - pip install -e .

  test:
    desc: Run all tests
    cmds:
      - python -m pytest

  lint:
    desc: Run ruff linter
    cmds:
      - pip install ruff
      - ruff check .

  fmt:
    desc: Format Python source files
    cmds:
      - pip install ruff
      - ruff format .

  check:
    desc: Format check, tests, and lint
    cmds:
      - ruff check .
      - python -m pytest
      - ruff format --check .

  release:
    desc: Build release archives
    cmds:
      - mkdir -p {{.DIST}}
      - pip install build
      - python -m build --outdir {{.DIST}}

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf {{.DIST}} *.egg-info .ruff_cache __pycache__
      - find . -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null; true
